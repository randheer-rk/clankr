[package]
name = "clank"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
nix = { version = "0.29", features = ["term", "ioctl"] }
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
clankr-types = { path = "../clankr-types" }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "form", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_yaml_ng = "0.10"
chrono = "0.4"
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
axum = "0.8"
clankr-store = { path = "../clankr-store", features = ["embedded"] }
clankrd = { path = "../clankrd" }
clankr-node = { path = "../clankr-node" }
clankr-tls = { path = "../clankr-tls" }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
