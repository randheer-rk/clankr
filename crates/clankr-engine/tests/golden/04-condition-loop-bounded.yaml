  entrypoint: attempt
  nodes:
    attempt:
      agentRef: solver
      maxIterations: 4
      next: check
      type: agent
    check:
      else: attempt
      equals: true
      path: $.attempt.ok
      then: done
      type: condition
    done:
      toolRef: reporter
      type: activity
