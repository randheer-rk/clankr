description: A retryable failure is retried with deterministic backoff; exhausting attempts fails the run.
graph:
  entrypoint: work
  nodes:
    work:
      agentRef: worker
      type: agent
  retryPolicy:
    initialBackoff: 2s
    maxAttempts: 3
    maxBackoff: 10s
inputs:
- type: RunStarted
  input: {}
- after: 1
  type: TaskFailed
  task: work#1.1
  error: timeout
  retryable: true
- after: 3
  type: TaskFailed
  task: work#1.2
  error: timeout
  retryable: true
- after: 5
  type: TaskFailed
  task: work#1.3
  error: timeout
  retryable: true
expect:
  history:
  - type: RunStarted
    input: {}
  - type: NodeEntered
    node: work
  - type: TaskScheduled
    task: work#1.1
    node: work
    attempt: 1
    queue: agent/worker
    notBefore: 2026-01-01T00:00:00Z
  - type: TaskFailed
    task: work#1.1
    error: timeout
    retryable: true
  - type: TaskScheduled
    task: work#1.2
    node: work
    attempt: 2
    queue: agent/worker
    notBefore: 2026-01-01T00:00:03Z
  - type: TaskFailed
    task: work#1.2
    error: timeout
    retryable: true
  - type: TaskScheduled
    task: work#1.3
    node: work
    attempt: 3
    queue: agent/worker
    notBefore: 2026-01-01T00:00:08Z
  - type: TaskFailed
    task: work#1.3
    error: timeout
    retryable: true
  - type: RunFailed
    reason: 'node work failed after 3 attempt(s): timeout'
  state:
    status: Failed
    data:
      input: {}
    steps: 1
    visits:
      work: 1
    tasks: {}
    timers: {}
    waits: {}
    joinArrivals: {}
    joinSwallow: {}
    error: 'node work failed after 3 attempt(s): timeout'
