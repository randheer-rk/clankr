[package]
name = "clankrd"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clankr-types = { path = "../clankr-types" }
clankr-store = { path = "../clankr-store", features = ["embedded"] }
clankr-engine = { path = "../clankr-engine" }
clankr-gateway = { path = "../clankr-gateway" }
clankr-tls = { path = "../clankr-tls" }
axum = "0.8"
async-stream = "0.3"
clap = { version = "4", features = ["derive", "env"] }
futures-core = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
tracing = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
hmac = "0.13"
base64 = "0.23.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service"] }
sha2 = "0.11"
chrono = "0.4.45"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
tracing-opentelemetry = "0.34"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rust-embed = { version = "8", features = ["mime-guess"] }

[dev-dependencies]
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
rcgen = "0.14"
# reqwest ends up as rustls-no-provider via postgresql_embedded; pick ring explicitly

